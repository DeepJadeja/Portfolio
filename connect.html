<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect — Chandradeepsinh Jadeja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#fff;--fg:#0d0d0d;--muted:#5f5f5f;--rule:#0d0d0d;--accent:#2f6bff;--accent-ink:#ffffff;
    --f-disp:"Archivo",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;--bw:2px}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0d;--fg:#f2f2ee;--muted:#9a9a95;--rule:#f2f2ee;color-scheme:dark}}
  :root[data-theme=dark]{--bg:#0d0d0d;--fg:#f2f2ee;--muted:#9a9a95;--rule:#f2f2ee;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  h1{font-family:var(--f-disp);margin:0;line-height:.9;letter-spacing:-.03em}
  .wrap{max-width:1000px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  .bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:var(--bw) solid var(--rule)}
  .bar .row{display:flex;align-items:center;gap:1.1rem;height:58px}
  .bar .home{font-family:var(--f-disp);font-weight:800;margin-right:auto;font-size:1rem}
  .bar nav{display:flex;gap:1.1rem;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
  .bar nav a{color:var(--muted)}.bar nav a:hover,.bar nav a[aria-current]{color:var(--fg);text-decoration:underline;text-underline-offset:5px}
  .tgl{border:var(--bw) solid var(--rule);background:transparent;color:var(--fg);width:36px;height:32px;cursor:pointer;font-size:.95rem}
  .tgl:hover{background:var(--accent);color:var(--accent-ink)}
  @media(max-width:560px){.bar nav{gap:.7rem;font-size:.64rem}.bar .home{font-size:.82rem}}
  main{flex:1;display:flex;align-items:center}
  .page{padding-block:clamp(2.6rem,8vw,5rem);width:100%}
  .psub{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
  .big{font-family:var(--f-disp);font-weight:900;font-size:clamp(2.8rem,13vw,8rem);line-height:.86;letter-spacing:-.03em}
  .mailrow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}
  .mail{font-family:var(--f-mono);font-size:clamp(1rem,3.4vw,1.5rem);border-bottom:var(--bw) solid var(--fg);user-select:all}
  .btn{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;border:var(--bw) solid var(--rule);background:transparent;color:var(--fg);padding:.6rem .9rem;cursor:pointer}
  .btn:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .note{margin-top:1.4rem;color:var(--muted);max-width:46ch}
  footer{border-top:var(--bw) solid var(--rule);padding-block:1.8rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  footer a:hover{color:var(--fg)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap row">
  <a class="home" href="index.html">← Chandradeepsinh Jadeja</a>
  <nav><a href="work.html">Work</a><a href="skills.html">Skills</a><a href="about.html">About</a><a href="connect.html" aria-current="page">Connect</a></nav>
  <button class="tgl" aria-label="Switch theme">◐</button>
</div></header>

<main><div class="wrap page">
  <div class="psub">Say hello</div>
  <h1 class="big">Let's talk.</h1>
  <div class="mailrow">
    <span class="mail" id="mail">jadejadeja07@gmail.com</span>
    <button class="btn" id="copy">Copy</button>
    <a class="btn" href="https://www.linkedin.com/in/chandradeepsinh-jadeja" target="_blank" rel="noopener">LinkedIn ↗</a>
  </div>
  <p class="note">Looking for product, program, or product-developer roles. Open to 2027 start, based in Boston and happy to relocate.</p>
</div></main>

<footer class="wrap"><span>© <span id="yr"></span> Chandradeepsinh Jadeja</span><a href="index.html">Back to home ↑</a></footer>
<script>
(function(){var r=document.documentElement,b=document.querySelector('.tgl');function sd(){return matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches}var s=null;try{s=localStorage.getItem('deep-theme')}catch(e){}if(s)r.setAttribute('data-theme',s);function cur(){var a=r.getAttribute('data-theme');return a?a:(sd()?'dark':'light')}function p(){if(b)b.textContent=cur()==='dark'?'☀':'☾'}p();if(b)b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('deep-theme',n)}catch(e){}p()});})();
(function(){var b=document.getElementById('copy'),v=document.getElementById('mail');b.addEventListener('click',function(){var t=v.textContent.trim();function ok(){var o=b.textContent;b.textContent='Copied';setTimeout(function(){b.textContent=o},1400)}function sel(){var r=document.createRange();r.selectNodeContents(v);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(sel)}else sel()});})();
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
